
name: ساخت APK اندروید

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت فایل‌های پروژه
        uses: actions/checkout@v4

      - name: نصب Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: آماده‌سازی Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.11.1"

      - name: بررسی مسیر فایل‌ها
        run: |
          pwd
          ls -la
          ls -la app
          ls -la app/src
          ls -la app/src/main
          test -f app/src/main/AndroidManifest.xml

      - name: ساخت APK
        run: gradle assembleDebug

      - name: ذخیره فایل APK
        uses: actions/upload-artifact@v4
        with:
          name: BehroozVPN-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
