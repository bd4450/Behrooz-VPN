
name: ساخت APK اندروید

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت فایل‌های پروژه
        uses: actions/checkout@v4

      - name: نصب Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: آماده‌سازی Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.11.1"

      - name: بررسی Manifest
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          xmllint --noout app/src/main/AndroidManifest.xml
          echo "Manifest is valid"

      - name: ساخت APK
        run: gradle assembleDebug --stacktrace

      - name: بررسی مشخصات APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          echo "Checking APK..."
          ls -lh "$APK"

          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)

          if [ -z "$AAPT" ]; then
            echo "AAPT not found"
            exit 1
          fi

          "$AAPT" dump badging "$APK"

      - name: بررسی امضای APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "Apksigner not found"
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

      - name: ذخیره فایل APK
        uses: actions/upload-artifact@v4
        with:
          name: BehroozVPN-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
