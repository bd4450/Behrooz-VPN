
name: ساخت APK اندروید

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت فایل‌های پروژه
        uses: actions/checkout@v4

      - name: نصب Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: آماده‌سازی Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.11.1"

      - name: نصب ابزار بررسی XML
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils

      - name: بررسی فایل AndroidManifest
        run: |
          echo "Checking AndroidManifest.xml"
          if xmllint --noout app/src/main/AndroidManifest.xml; then
            echo "XML is valid"
          else
            echo "XML has an error"
            nl -ba app/src/main/AndroidManifest.xml
            exit 1
          fi

      - name: نمایش محتوای Manifest
        run: |
          nl -ba app/src/main/AndroidManifest.xml

      - name: ساخت APK
        run: gradle assembleDebug --stacktrace

      - name: ذخیره فایل APK
        uses: actions/upload-artifact@v4
        with:
          name: BehroozVPN-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
